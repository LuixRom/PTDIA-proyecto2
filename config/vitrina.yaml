  h_camisa_denim: {nombre: "Camisa denim", linea: hombre, prompt: "a light blue denim button-up shirt", mangas: largas}
  h_blazer_azul: {nombre: "Blazer azul marino", linea: hombre, prompt: "solid navy blue blazer", mangas: largas}
