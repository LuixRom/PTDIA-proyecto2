  m_lentes_negros: {nombre: "Lentes negros rectangulares", linea: mujer, tipo: accesorio, zona: lentes, prompt: "thin black rectangular eyeglasses with clear lenses"}
  m_lentes_carey: {nombre: "Lentes de carey marrón redondos", linea: mujer, tipo: accesorio, zona: lentes, prompt: "thick brown tortoiseshell round eyeglasses with clear lenses", negativo: "thin frames, silver, metal"}
