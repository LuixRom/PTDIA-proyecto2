# Ocasiones: 7 a 10 looks por línea (solo prendas validadas con modelos reales). Modo prueba: los 5 primeros (reproducible); producción: 5 al azar. Una nueva
# ronda sustituye cada look rechazado por otro de la ocasión aún no mostrado.
