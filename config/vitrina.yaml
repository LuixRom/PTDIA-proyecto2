    hombre: [[h_camisa_lino, h_short_chino], [h_camisa_cuadros, h_short_chino], [h_casaca_jean, h_jean_oscuro, h_lentes_negros], [h_casaca_cuero, h_jean_oscuro], [h_hoodie_gris, h_jean_oscuro], [h_camisa_cuadros, h_jean_oscuro], [h_camisa_lino, h_chino_beige], [h_bomber, h_jean_oscuro], [h_camisa_denim, h_chino_beige], [h_sueter_verde, h_jean_oscuro]]

# Instrucción escrita: la misma prenda en 5 variantes, para que las cinco opciones sean distintas.
instruction_variants: ["", "in a neutral color palette", "in a bold color palette", "with a relaxed fit", "with a tailored fit"]

resources:
  t4: {min_vram_gb: 12, min_ram_gb: 10, min_disk_gb: 14}

app_approaches: [B, API]   # enfoques visibles en la app; API solo con clave (.env). El A local (img2img) queda en el código

# Igual que config/pilot.yaml: se COMPRUEBA sin red ni pip (p2/env_check.validate).
dependencies:
  required:
    torch: ">=2.4"
    torchvision: ""
    transformers: ">=4.45"
    accelerate: ""
    huggingface-hub: ""
    diffusers: ">=0.40.0"   # mínimo; las versiones más nuevas que las probadas solo avisan (dependencies.tested)
    safetensors: ""
    numpy: ""
    pillow: ""
    scikit-image: ""
    opencv-python: ""
    scipy: ""
    psutil: ""
    pydantic: ">=2"
    pyyaml: ""
    packaging: ""
  verify_declared_requirements_of: [diffusers, transformers, accelerate]
  # Últimas versiones probadas. Fuera de este rango NO se bloquea (Colab actualiza paquetes a menudo):
  # se avisa y la prueba de importación real (env_check.import_smoke) decide.
  tested:
    diffusers: "<0.42"   # 0.41.0 probado en Colab (oct-2026)
  optional: {}
